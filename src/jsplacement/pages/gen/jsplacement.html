<div class="canvasbox">
	<div class="viewcontrols disabled">
		<a href="#" onclick="showHeight(1);">高度图</a>
		<a href="#" onclick="showHeight(0);">着色图</a>
	</div>
	<div class="canvasboxinner">
		<canvas id="dis" generated="nope" width="1024" height="1024" onclick="refresh()">
		</canvas>
		<canvas id="dat" width="1024" height="1024" onclick="refresh()">
		</canvas>
	</div>
</div>

<div class="editorbox" onclick="hideColorizer();">

	<div class="sliderbox2w">
		<div class="values">迭代次数 <output id="iterations">1000</output></div>
		<div class="slider"><input id="slideiterations" type="range" value="1000" min="10" max="2000" step="10" oninput="setValue('#iterations',value)" onchange="refresh()"></div>
	</div>
	<div class="sliderspacer"></div>
	<div class="sliderbox2w">
		<div class="values">背景亮度 <output id="bgcol">128</output></div>
		<div class="slider"><input id="slidebgcol" type="range" value="128" min="0" max="255" step="1" oninput="setValue('#bgcol',value)" onchange="refresh()"></div>
	</div>
	<div style="clear:both"></div>
	<div class="horispacer2"></div>

	<div class="checkNtweak"> <!-- BOX -->
		<input type="checkbox" id="draw.Box" checked="checked" onchange="refresh()">
		<label for="draw.Box">
			<svg viewBox="0 0 50 50" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:1.41421;">
				<rect x="5" y="5" width="40" height="40"/>
			</svg>
		</label>
		<div class="Ntweak">
			<div class="tweak2w dual">
				<div class="values">
						<output id="Box.clampmin" class="min">0</output>
						亮度区间
						<output id="Box.clampmax" class="max">255</output>
				</div>
				<input id="slideBox.clampmin" type="range" value="0" min="0" max="255" step="1" oninput="setValue('#Box\\.clampmin',value)" onchange="refresh()">
				<input id="slideBox.clampmax" type="range" value="255" min="0" max="255" step="1" oninput="setValue('#Box\\.clampmax',value)" onchange="refresh()">
			</div>
			<div class="sliderspacer2"></div>
			<div class="tweak2w">
				<div class="values">
						缩放
						<output id="Box.scale" class="rosentti">100</output>
				</div>
				<input id="slideBox.scale" type="range" value="100" min="50" max="200" step="1" oninput="setValue('#Box\\.scale',value)" onchange="refresh()">
			</div>
		</div>
		<div style="clear:both"></div>
	</div>

	<div class="checkNtweak"> <!-- BOX-A -->
		<input type="checkbox" id="draw.BoxA" checked="checked" onchange="refresh()">
		<label for="draw.BoxA">
			<svg viewBox="0 0 50 50" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:1.41421;">
				<rect x="5" y="5" width="30" height="30" style="fill-opacity:0.8;"/>
				<rect x="15" y="15" width="30" height="30" style="fill-opacity:0.8;"/>
			</svg>
		</label>
		<div class="Ntweak">
			<div class="tweak3w dual">
				<div class="values">
						<output id="BoxA.clampmin" class="min">0</output>
						亮度区间

			</div>
			<div class="sliderspacer2"></div>
			<div class="tweak3w dual">
				<div class="values">
						<output id="BoxA.clampAmin" class="min rosentti">50</output>
						透明度区间
						<output id="BoxA.clampAmax" class="max rosentti">80</output>
				</div>
				<input id="slideBoxA.clampAmin" type="range" value="50" min="0" max="100" step="1" oninput="setValue('#BoxA\\.clampAmin',value)" onchange="refresh()">
				<input id="slideBoxA.clampAmax" type="range" value="80" min="0" max="100" step="1" oninput="setValue('#BoxA\\.clampAmax',value)" onchange="refresh()">
			</div>
			<div class="sliderspacer2"></div>
			<div class="tweak3w">
				<div class="values">
						缩放
						<output id="BoxA.scale" class="rosentti">100</output>
				</div>
				<input id="slideBoxA.scale" type="range" value="100" min="50" max="200" step="1" oninput="setValue('#BoxA\\.scale',value)" onchange="refresh()">
			</div>
		</div>
		<div style="clear:both"></div>
	</div>

		</label>

						<output id="Grid.clampmax" class="max">255</output>
				</div>

				<input id="slideGrid.clampmax" type="range" value="255" min="0" max="255" step="1" oninput="setValue('#Grid\\.clampmax',value)" onchange="refresh()">
			</div>
			<div class="sliderspacer2"></div>
			<div class="tweak4w">
				<div class="values">
						缩放
						<output id="Grid.scale" class="rosentti">100</output>
				</div>
				<input id="slideGrid.scale" type="range" value="100" min="50" max="200" step="1" oninput="setValue('#Grid\\.scale',value)" onchange="refresh()">
			</div>
			<div class="sliderspacer2"></div>
			<div class="tweak4w">
				<div class="values">
						间距
						<output id="Grid.spacing" class="rosentti">100</output>
				</div>
				<input id="slideGrid.spacing" type="range" value="100" min="10" max="990" step="10" oninput="setValue('#Grid\\.spacing',value)" onchange="refresh()">
			</div>
			<div class="sliderspacer2"></div>
			<div class="tweak4w">
				<div class="values">
						最大数量
						<output id="Grid.amount">5</output>
				</div>
				<input id="slideGrid.amount" type="range" value="5" min="2" max="10" step="1" oninput="setValue('#Grid\\.amount',value)" onchange="refresh()">
			</div>
		</div>
		<div style="clear:both"></div>
	</div>

	<div class="checkNtweak"> <!-- BAT-V -->
		<input type="checkbox" id="draw.BatV" checked="checked" onchange="refresh()">
		<label for="draw.BatV">
			<svg viewBox="0 0 50 50" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:1.41421;">
				<path d="M15,5l0,40l-10,0l0,-40l10,0Zm30,0l0,40l-10,0l0,-40l10,0Zm-15,0l0,40l-10,0l0,-40l10,0Z" />
			</svg>
		</label>
		<div class="Ntweak">
			<div class="tweak4w dual">

			</div>
			<div class="sliderspacer2"></div>
			<div class="tweak4w">
				<div class="values">

				</div>
				<input id="slideBatV.scale" type="range" value="100" min="50" max="200" step="1" oninput="setValue('#BatV\\.scale',value)" onchange="refresh()">
			</div>
			<div class="sliderspacer2"></div>
			<div class="tweak4w">

				</div>
				<input id="slideBatV.amount" type="range" value="5" min="2" max="10" step="1" oninput="setValue('#BatV\\.amount',value)" onchange="refresh()">
			</div>
		</div>
		<div style="clear:both"></div>
	</div>

	<div class="checkNtweak"> <!-- BAT-H -->
		<input type="checkbox" id="draw.BatH" checked="checked" onchange="refresh()">
		<label for="draw.BatH">
			<svg viewBox="0 0 50 50" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:1.41421;">
				<path d="M45,15l-40,0l0,-10l40,0l0,10Zm0,30l-40,0l0,-10l40,0l0,10Zm0,-15l-40,0l0,-10l40,0l0,10Z" />

		<input type="checkbox" id="draw.Lines" checked="checked" onchange="refresh()">

			<svg viewBox="0 0 50 50" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:1.5;">
				<g>
					<path d="M5,17.5l40,0" style="fill:none;stroke-width:2px;"/>
					<path d="M17.5,5l0,40" style="fill:none;stroke-width:2px;"/>
					<path d="M32.5,20l0,25" style="fill:none;stroke-width:2px;"/>

<div class="newactions">
	<a href="#" id="RandomizeAll" onclick="randomizeAll()">随机参数</a>
	<a href="#" id="ShowPresets" onclick="ShowPresets()">预设</a>
</div>
<div id="presetlist" class="hidden">
</div>
<div class="presethider" onclick="HidePresets()"></div>

<div id="colorizer" class="hidden">
</div>


<div class="actionbox">
	<a href="#" class="generate" onclick="refresh()">生成</a>
	<a href="#" class="height disabled" onclick="saveHeight(savename)">保存高度图</a>
	<a href="#" class="undo disabled" onclick="undoMap()">撤销</a>
	<a href="#" class="invert disabled" onclick="invertMap()">反相</a>
	<a href="#" class="normal disabled" onclick="saveNormal(savename)">保存法线图</a>
	<a href="#" class="colorize disabled" onclick='toggleColorizer()'>渐变着色</a>
	<a href="#" class="color disabled" onclick="saveColor(savename)">保存着色图</a>
</div>


<script>
	function setValue(id,value) {
		document.querySelector(id).value = value;
	}
</script>
