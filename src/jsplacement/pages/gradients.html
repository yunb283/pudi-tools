<span id="gradients">
</span>

<script>
  $(function(){
    var gradlist = document.getElementById("gradients");
    if (!gradlist) return;
    // 嵌入版：__dirname 是 "."，gpath 是相对 iframe 文档的路径
    var gpath = __dirname + "/Gradients";
    var supported = ["jpg","jpeg","png","gif","bmp"];

    gfiles = fs.readdirSync(gpath);

    gfiles = gfiles.filter(function(file){
      for(i=0;i<supported.length;i++){
        if(file.indexOf(supported[i]) !== -1){ return true; }
      }
    });

    var html = "";
    for (i = 0; i < gfiles.length; i++){
      var f = gfiles[i];
      var src = f.indexOf('/') >= 0 ? f : gpath + "/" + f;
      var id = f.slice(f.lastIndexOf('/') + 1);
      html += "<img src=\"" + src + "\" id=\"" + id + "\" onclick=\"theColorizer('" + id + "')\" />";
    }
    gradlist.innerHTML = html;
    // 有缩略图了，colorizer.js 的 loadGrad() 会跳过，不会重复追加
  });
  custoloaded = false;
</script>
